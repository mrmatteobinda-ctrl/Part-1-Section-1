<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: #000000;
    }

    .box {
      background: #0a0a0a;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 0 20px rgba(0, 255, 70, 0.3);
      text-align: center;
      border: 1px solid #00ff46;
    }

    h2 {
      color: #00ff46;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
    }

    input {
      padding: 0.5rem;
      margin: 0.5rem 0;
      border: 1px solid #00ff46;
      border-radius: 4px;
      width: 200px;
      background: #000000;
      color: #00ff46;
      outline: none;
    }

    input::placeholder {
      color: #005920;
    }

    button {
      display: block;
      margin: 1rem auto 0;
      padding: 0.5rem 1.5rem;
      background: #003d14;
      color: #00ff46;
      border: 1px solid #00ff46;
      border-radius: 4px;
      cursor: pointer;
      letter-spacing: 1px;
      transition: background 0.2s;
    }

    button:hover {
      background: #00ff46;
      color: #000000;
    }

    .error {
      color: #ff4444;
      font-size: 0.85rem;
      margin-top: 0.75rem;
    }
  </style>
</head>
<body>
  <div class="box">
    <h2>Enter Code</h2>
    <input type="password" id="pw" placeholder="Enter code..." />
    <button onclick="check()">Submit</button>
    <p class="error" id="err"></p>
  </div>

  <script>
    function check() {
      const password = document.getElementById('pw').value;

      if (password === "GOODWORK") {
        window.open("https://sites.google.com/view/end-of-year-game/part-1/copy-of-untitled-page", "_blank");
      } else {
        document.getElementById('err').textContent = "Incorrect code. Try again.";
      }
    }
  </script>
</body>
</html>
